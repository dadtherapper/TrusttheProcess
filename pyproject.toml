[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-the-process"
version = "0.1.0"
description = "Trust the Process. Verify the Behavior. Explainable local endpoint monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["psutil>=6.1,<8", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6.11,<7"]

[project.scripts]
trust-the-process = "trust_the_process.__main__:main"

[tool.setuptools.packages.find]
include = ["trust_the_process*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

