name: Windows executable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm packaging/TrustTheProcess.spec
      - name: Verify source GUI interactions
        run: python scripts/gui_smoke.py
      - name: Verify packaged pipeline and GUI rendering
        run: python scripts/gui_smoke.py --exe dist/TrustTheProcess/TrustTheProcess.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TrustTheProcess-Windows-x64
          path: dist/TrustTheProcess/
          if-no-files-found: error

